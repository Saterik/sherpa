name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_DRIVER: pdo_pgsql
  DATABASE_HOST: localhost
  DATABASE_PORT: 5432
  DATABASE_NAME: sherpa_test
  DATABASE_USER: sherpa
  DATABASE_PASSWORD: sherpa_password
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET: test-secret-key
  APP_ENV: test
  APP_DEBUG: true

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sherpa_test
          POSTGRES_USER: sherpa
          POSTGRES_PASSWORD: sherpa_password
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U sherpa -d sherpa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports: 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, zip, bcmath, gd, amqp
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install backend dependencies
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist

      - name: Run database migrations
        working-directory: ./backend
        run: php vendor/bin/doctrine-migrations migrate --no-interaction

      - name: Run PHPStan
        working-directory: ./backend
        run: php vendor/bin/phpstan analyse src --level=5

      - name: Check code style
        working-directory: ./backend
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

      - name: Run PHPUnit tests
        working-directory: ./backend
        run: php vendor/bin/phpunit --coverage-clover=coverage.clover

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.clover
          flags: backend

  frontend-test:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linting
        working-directory: ./frontend
        run: npm run lint

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:ci

      - name: Build production
        working-directory: ./frontend
        run: npm run build:prod

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sherpa-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/sherpa-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sherpa-frontend:latest,${{ secrets.DOCKERHUB_USERNAME }}/sherpa-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sherpa-nginx:latest,${{ secrets.DOCKERHUB_USERNAME }}/sherpa-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploy to staging server..."
          # Add your deployment commands here
          # Example: ssh user@staging-server "cd /app && docker-compose pull && docker-compose up -d"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-build]
    if: always()
    
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Build failed! Notify team..."
          # Add notification logic (Slack, Email, etc.)