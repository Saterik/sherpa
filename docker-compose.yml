version: '3.8'

services:
  # Database
  db:
    image: postgres:16-alpine
    container_name: sherpa-db
    environment:
      POSTGRES_DB: sherpa
      POSTGRES_USER: sherpa
      POSTGRES_PASSWORD: sherpa_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherpa -d sherpa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: sherpa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sherpa-backend
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_DRIVER=pdo_pgsql
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=sherpa
      - DATABASE_USER=sherpa
      - DATABASE_PASSWORD=sherpa_password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRATION=3600
      - FRONTEND_URL=http://localhost:4200
      - MAX_FILE_SIZE=10485760
      - IMAGE_STORAGE_PATH=/var/www/html/storage/images
      - IMAGE_PUBLIC_PATH=/storage/images
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "9000"

  # Frontend (Nginx + Angular dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: sherpa-frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  # Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sherpa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  rabbitmq_data:
  backend_storage:

networks:
  default:
    driver: bridge