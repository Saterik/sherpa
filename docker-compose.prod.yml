version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sherpa-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - sherpa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: sherpa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sherpa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ${DOCKERHUB_USERNAME}/sherpa-backend:${VERSION:-latest}
    container_name: sherpa-backend
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_DRIVER=pdo_pgsql
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=3600
      - FRONTEND_URL=${FRONTEND_URL}
      - MAX_FILE_SIZE=10485760
      - IMAGE_STORAGE_PATH=/var/www/html/storage/images
      - IMAGE_PUBLIC_PATH=/storage/images
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - sherpa-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${DOCKERHUB_USERNAME}/sherpa-frontend:${VERSION:-latest}
    container_name: sherpa-frontend
    networks:
      - sherpa-network
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: ${DOCKERHUB_USERNAME}/sherpa-nginx:${VERSION:-latest}
    container_name: sherpa-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - sherpa-network
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  rabbitmq_data:
  backend_storage:

networks:
  sherpa-network:
    driver: bridge